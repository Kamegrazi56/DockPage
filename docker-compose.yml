services:
  dockpage:
    image: ghcr.io/kamegrazi56/dockpage:latest
    container_name: dockpage
    environment:
      - TITLE=Homelab
      - PORTAINER_URL=https://192.168.1.210:9443
      - PORTAINER_TOKEN=COLLE_ICI_TON_JETON
      - VERIFY_TLS=false
      - HOSTS=local=192.168.1.210,NAS=192.168.1.XX
    volumes:
      - /home/kamegrazi/docker/dockpage/data:/data
    ports:
      - "8088:8080"
    restart: unless-stopped
