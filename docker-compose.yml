services:
  dockpage:
    build: .
    image: dockpage:latest
    container_name: dockpage
    ports:
      - "${DOCKPAGE_PORT:-8088}:8080"
    environment:
      - TITLE=${TITLE:-Homelab}
      - PORTAINER_URL=${PORTAINER_URL}
      - PORTAINER_TOKEN=${PORTAINER_TOKEN}
      - VERIFY_TLS=${VERIFY_TLS:-false}
      # Adresse utilisée pour les liens de chaque environnement : NomExactPortainer=IP,Autre=IP
      - HOSTS=${HOSTS:-}
    volumes:
      - dockpage-data:/data
    restart: unless-stopped

volumes:
  dockpage-data:
